<!doctype html>
<html lang="en-IN">
<head>
  <!-- BASIC -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- TITLE (60 chars max – keyword rich) -->
  <title>Digital Pet Clinic | Online Vet Consultation Across India</title>

  <!-- META DESCRIPTION (150–160 chars) -->
  <meta
    name="description"
    content="Consult certified veterinarians online for dogs, cats & pets. Video, chat & prescription support available across India."
  />

  <!-- KEYWORDS (still useful for minor engines) -->
  <meta
    name="keywords"
    content="online vet consultation, digital pet clinic, veterinary doctor online, pet doctor india, dog vet online, cat vet online"
  />

  <!-- AUTHOR -->
  <meta name="author" content="Digital Pet Clinic" />

  <!-- CANONICAL -->
  <link rel="canonical" href="https://www.digitalpetclinic.com/" />

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="/mainlogo.png" />

  <!-- OPEN GRAPH (Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Digital Pet Clinic | Online Vet Consultation" />
  <meta
    property="og:description"
    content="Get instant online veterinary consultation for your pets anywhere in India. Trusted vets, fast care."
  />
  <meta property="og:url" content="https://www.digitalpetclinic.com/" />
  <meta property="og:image" content="https://www.digitalpetclinic.com/og-image.jpg" />
  <meta property="og:site_name" content="Digital Pet Clinic" />

  <!-- TWITTER CARD -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Digital Pet Clinic | Online Vet Consultation" />
  <meta
    name="twitter:description"
    content="Online vet consultation for dogs, cats & pets across India."
  />
  <meta name="twitter:image" content="https://www.digitalpetclinic.com/og-image.jpg" />

  <!-- GEO TARGETING (India SEO boost) -->
  <meta name="geo.region" content="IN" />
  <meta name="geo.placename" content="India" />
  <meta name="language" content="English" />

  <!-- SEARCH ENGINE -->
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="googlebot" content="index, follow" />

  <!-- STRUCTURED DATA (MedicalBusiness) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VeterinaryCare",
    "name": "Digital Pet Clinic",
    "url": "https://www.digitalpetclinic.com/",
    "logo": "https://www.digitalpetclinic.com/DigitalLogo.png",
    "description": "Online veterinary consultation and digital pet healthcare services across India.",
    "areaServed": {
      "@type": "Country",
      "name": "India"
    },
    "availableService": {
      "@type": "MedicalProcedure",
      "name": "Online Veterinary Consultation"
    }
  }
  </script>

</head>
